theme:
  name: material
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - search.suggest
    - search.highlight

plugins:
  - search:
      prebuild_index: false
      lang:
        - es
        - en
      separator: '[\s\-\.]+'
  - mkdocs-video:
      is_video: True
      video_autoplay: false

extra_javascript:
  - javascripts/remove-diacritics.js
  - https://hypothes.is/embed.js

extra_css:
  - stylesheets/extra.css
